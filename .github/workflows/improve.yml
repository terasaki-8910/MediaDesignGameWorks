# Self-improvement loop: aggregate play data -> Claude Code proposes edits -> deterministic check/apply -> commit -> deploy.
# collect reads the play data through the game's API with a GitHub OIDC token (no stored secret);
# analyze runs the agent with no write permission and no deploy credentials; apply never runs an LLM.
name: improve

on:
  schedule:
    - cron: "17 18 * * *" # every day at 03:17 JST
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if there are few new sessions"
        type: boolean
        default: false

concurrency:
  group: improve
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only this job may ask GitHub for an OIDC token; the game's export endpoint accepts it instead of a secret.
  collect:
    if: vars.AI_LOOP_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aggregate telemetry (read-only)
        run: npm run ai:metrics -- --out ai/work/metrics.json
        env:
          TELEMETRY_EXPORT_URL: ${{ vars.TELEMETRY_EXPORT_URL || 'https://mirrordimension.vercel.app/api/telemetry-export' }}
      - name: Gate (enough new sessions, monthly cap)
        id: gate
        env:
          AI_MIN_NEW_SESSIONS: ${{ vars.AI_MIN_NEW_SESSIONS }}
          AI_MAX_RUNS_PER_MONTH: ${{ vars.AI_MAX_RUNS_PER_MONTH }}
        run: npm run ai:gate -- ai/work/metrics.json ${{ inputs.force && '--force' || '' }}
      - name: Summary
        if: always()
        run: |
          echo "### Improvement loop" >> "$GITHUB_STEP_SUMMARY"
          echo "gate: ${{ steps.gate.outputs.run }} (${{ steps.gate.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: ai/work/metrics.json
          retention-days: 30

  analyze:
    needs: collect
    if: needs.collect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: metrics
          path: ai/work/
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Propose (Claude Code, headless)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          set +e
          claude -p "$(cat ai/prompts/improve.md)" \
            ${MODEL:+--model "$MODEL"} \
            --permission-mode dontAsk \
            --allowedTools "Read" "Glob" "Grep" "Edit(ai/work/proposal.json)" "Bash(npm run ai:check)" \
            --disallowedTools "WebFetch" "WebSearch" \
            --max-turns 20 \
            --output-format json \
            --json-schema "$(cat ai/schemas/run-summary.json)" \
            > ai/work/run.json
          echo "claude exit code: $?"
          npm run ai:check
          echo "independent check exit code: $?"
          exit 0
      - name: Summary
        if: always()
        run: |
          [ -f ai/work/proposal.json ] && { echo '```json'; cat ai/work/proposal.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-work
          path: ai/work/
          retention-days: 30

  apply:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ai-work
          path: ai/work/
      - name: Apply the checked proposal (deterministic)
        id: apply
        run: npm run ai:apply -- ai/work/proposal.json
      - name: Validate, test and build
        run: npm run validate && npm test && npm run build
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.AI_LOOP_MODE }}
        run: |
          # Vercel's Hobby plan deploys only commits by the project owner, so by default commit as the repository owner
          git config user.name "${{ vars.BOT_GIT_NAME || github.repository_owner }}"
          git config user.email "${{ vars.BOT_GIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}"
          git add src/stages src/revision.json ai/history
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "$MODE" = "pr" ] && [ "${{ steps.apply.outputs.changed }}" = "true" ]; then
            branch="ai/revision-${{ github.run_id }}"
            git switch -c "$branch"
            git commit -F ai/work/commit-msg.txt
            git push origin "$branch"
            gh pr create --title "$(head -n1 ai/work/commit-msg.txt)" --body-file ai/work/commit-msg.txt --base "${{ github.ref_name }}"
          else
            git commit -F ai/work/commit-msg.txt
            git push
          fi
      - name: Deploy to Vercel (when VERCEL_TOKEN is configured)
        if: steps.apply.outputs.changed == 'true' && vars.AI_LOOP_MODE != 'pr' && env.HAS_VERCEL_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@65.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.4.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
